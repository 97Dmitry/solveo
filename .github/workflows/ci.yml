name: CI

on:
  # Branches are checked through pull requests; pushing to master re-checks the merged result.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Vite+, Node and pnpm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          working-directory: frontend
          node-version: '24'
          cache: true
          run-install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: vp install --frozen-lockfile

      - name: Check frontend formatting, lint and types
        run: make frontend-check

      - name: Test frontend
        run: make frontend-test

      - name: Test Go with race detector
        run: go test -race ./internal/...

      - name: Vet portable Go packages
        run: go vet ./internal/...

      # The linter is compiled from source by make; reuse it while Makefile and go.mod are unchanged.
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      # Uses the golangci-lint version pinned in Makefile; lints host and Windows builds.
      - name: Lint Go
        run: make lint

  windows:
    name: Windows tests
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Only native Windows behavior needs a Windows runner; the build is cross-compiled below.
      - name: Test Go on Windows
        run: go test -v -timeout 2m ./internal/...

  build:
    name: Windows build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Separate cache key: the Wails CLI (pinned in Makefile) and its build objects are large
      # and only needed here; sharing the key would make the checks job restore them too.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Set up Vite+, Node and pnpm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          working-directory: frontend
          node-version: '24'
          cache: true
          run-install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: vp install --frozen-lockfile

      # Same targets as `make check`: bindings, frontend build, Windows vet and Wails cross-build.
      - name: Vet and build Windows x64 application
        run: make vet build

      - name: Upload Windows application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Solveo-windows-x64-${{ github.sha }}
          path: build/bin/Solveo.exe
          if-no-files-found: error
          retention-days: 14
