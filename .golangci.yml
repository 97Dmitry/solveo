version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # Win32 calls report failure through their return values; the error
        # result is GetLastError and is meaningless after successful calls.
        - (*syscall.LazyProc).Call
        - (*syscall.Proc).Call
        # Best-effort cleanup of temporary or rolled-back files.
        - os.Remove
        - os.RemoveAll
        - (*os.Root).Remove
        # Roots are opened for confinement only; nothing is buffered on close.
        - (*os.Root).Close
    staticcheck:
      checks:
        # golangci-lint defaults ...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ... plus: user-facing errors are Russian sentences that may start
        # with product names (Codex, Solveo).
        - -ST1005

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
